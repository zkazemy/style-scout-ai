[project]
name = "style-scout"
version = "0.1.0"
description = "Conversational fashion shopping assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-ai>=0.0.13",
    "pydantic-settings>=2.6.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "pandas>=2.3.3",
    "numpy>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
stylescout = "stylescout.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["slow: requires the real ONNX model (skipped by default)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/stylescout"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
